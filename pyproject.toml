[project]
name = "lead-intelligence"
version = "0.1.0"
description = "Lead Intelligence backend: ingestion, crawling, interpretation, scoring pipeline for e-commerce leads."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "motor>=3.4",
    "pymongo>=4.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pyright>=1.1",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)` is idiomatically used as an argument
# default — this is the documented FastAPI dependency-injection pattern,
# not the mutable-default-argument bug B008 exists to catch.
ignore = ["B008"]

[tool.pyright]
include = ["backend"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
