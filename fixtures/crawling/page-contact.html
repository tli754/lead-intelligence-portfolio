<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Contact Us — Acme Outdoor Gear</title></head>
<body>
  <main>
    <h1>Get in Touch</h1>
    <p>Email us at hello@acme-outdoor.example.com or use the form below.</p>
    <form action="/contact/submit" method="post">
      <label for="name">Name</label>
      <input type="text" id="name" name="name">
      <label for="message">Message</label>
      <textarea id="message" name="message"></textarea>
      <button type="submit">Send</button>
    </form>
  </main>
</body>
</html>
